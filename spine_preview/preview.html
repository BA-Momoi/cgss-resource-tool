<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CGSS Spine动画预览</title>
<link rel="stylesheet" href="library.css">
</head>
<body>
<main class="workspace" id="workspace">
<aside id="library" class="library" hidden aria-labelledby="library_title">
  <div class="library-header">
    <h2 id="library_title">资源库</h2>
    <button id="library_refresh" type="button" title="重新扫描下载目录" aria-label="重新扫描下载目录">↻</button>
  </div>
  <div class="library-fields">
    <label class="sr-only" for="library_search">搜索资源</label>
    <input type="search" id="library_search" placeholder="搜索名称、目录、动作包" autocomplete="off">
    <label class="sr-only" for="library_category">资源分类</label>
    <select id="library_category"><option value="">全部分类</option></select>
  </div>
  <p class="library-status" id="library_status" role="status"></p>
  <ul id="library_list" class="library-list" aria-label="Spine 资源"></ul>
</aside>
<section class="preview" aria-label="动画预览">
<div id="library_navigation" class="library-navigation" hidden>
  <div class="current-resource">
    <h2 id="library_current">动画预览</h2>
    <div id="library_folder"></div>
  </div>
  <div class="library-switcher">
    <button id="library_previous" type="button" title="上一个资源" aria-label="上一个资源">←</button>
    <span id="library_position" aria-live="polite"></span>
    <button id="library_next" type="button" title="下一个资源" aria-label="下一个资源">→</button>
  </div>
</div>
<details id="skin_swap" hidden>
<summary>更换角色</summary>
<p class="skin-hint">更换同一角色的图集和全部 PNG 贴图即可套用当前动作。有 N / S 两套骨架时，网页会分别检查兼容性。</p>
<div class="row skin-controls">
  <label>图集 <input id="skin_atlas" type="file" accept=".atlas,.asset"></label>
  <label>贴图 <input id="skin_png" type="file" accept=".png" multiple></label>
  <button type="button" id="skin_apply">应用角色</button>
  <label id="rig_choice" hidden>骨架 <select id="rig_variant"></select></label>
</div>
<p id="skin_status" role="status"></p>
</details>
<details id="manual">
<summary>手动导入</summary>
<div class="row"><label>骨架 .skel/.asset/.json：</label><input type="file" id="f_skel" accept=".skel,.skel.asset,.json,.asset" multiple></div>
<div class="row"><label>图集 .atlas：</label><input type="file" id="f_atlas" accept=".atlas,.atlas.asset,.asset"></div>
<div class="row"><label>贴图 .png：</label><input type="file" id="f_png" accept=".png" multiple></div>
</details>
<div class="row playback">
  <button id="btn_play">播放</button>
  <button id="btn_pause">暂停</button>
  <label class="speed">速度 <input type="range" id="speed" min="0.1" max="3" step="0.1" value="1"></label>
  <label><input type="checkbox" id="chk_all" checked> 显示全部层</label>
  <label><input type="checkbox" id="chk_flip" checked> 左右镜像</label>
  <button id="btn_export" title="按背景(bg)范围导出 MP4（最高码率）">导出MP4(beta)</button>
  <label class="gif-size">GIF 高度 <select id="gif_height">
    <option value="240">240 px</option>
    <option value="480" selected>480 px</option>
    <option value="720">720 px</option>
  </select></label>
  <button type="button" id="btn_export_gif" title="按整段动作的角色范围导出透明 GIF">导出 GIF</button>
  <span id="export_status" role="status"></span>
  <span id="fps"></span>
</div>
<div class="row" id="anim_rows"></div>
<div id="msg" role="status"></div>
<canvas id="cv"></canvas>
</section>
</main>

<script src="spine-core.js"></script>
<script src="spine-canvas.js"></script>
<script src="spine-webgl.js"></script>
<script src="cgss_skel_parser.js"></script>
<script src="mp4-muxer.min.js"></script>
<script>
var skelList = [];       // [{name, skeleton, state, data, sel, check}]
var atlasText = null;
var pngMap = {};         // basename -> Image
var compositeMap = {};   // basename -> 已合成 RGBA 的 canvas
var renderer = null, last = 0, playing = true;
var fit = { scale: 1, tx: 0, ty: 0 };
var SS = 2;              // 超采样倍数：整帧画到 2 倍离屏画布再缩小，消除三角形接缝
try { var _m = /[?&]ss=(\d+)/.exec(location.search); if (_m) SS = parseInt(_m[1], 10) || 2; } catch(e){}
var offCanvas = null, offRenderer = null;
var glCanvas = null, glRenderer = null;
var frameId = null, previewReady = false;
var loadVersion = { skel: 0, atlas: 0, png: 0 };
var loading = { skel: false, atlas: false, png: false };
var loadErrors = { skel: '', atlas: '', png: '' };
var catalogLoad = null;
var rigVariants = [];
var rigIndex = 0;
var skinVersion = 0;

function canSwapSkin(name){
  return /^(car_commuChara|SPKCStaff|SPACSkelton|SPSprachen)/i.test(name);
}

function manualRigFamily(name){
  var match = /^(car_commuChara)(Normal|Small)[._]|^(SPACSkelton|SPSprachen_)(N|S)[._]/i.exec(name);
  if (!match) return null;
  var variant = (match[2] || match[4]).toLowerCase();
  return { family: (match[1] || match[3]).toLowerCase(), label: /^(n|normal)$/.test(variant) ? 'N' : 'S' };
}

function setRigVariants(variants, index){
  ++skinVersion;
  rigVariants = variants;
  rigIndex = index;
  document.getElementById('skin_swap').hidden = !variants.length &&
    !(skelList.length === 1 && canSwapSkin(skelList[0].name));
  document.getElementById('rig_choice').hidden = variants.length < 2;
  var selector = document.getElementById('rig_variant');
  selector.replaceChildren(...variants.map(function(variant){ return new Option(variant.label); }));
  selector.selectedIndex = index;
  document.getElementById('skin_status').textContent = '';
  document.getElementById('skin_apply').disabled = false;
  document.getElementById('skin_atlas').value = '';
  document.getElementById('skin_png').value = '';
}

function msg(s){ document.getElementById('msg').textContent = s; }
function fileStatus(s){
  var error = loadErrors.skel || loadErrors.atlas || loadErrors.png;
  msg(error || s);
}
function resetPreview(){
  previewReady = false;
  if (frameId !== null) cancelAnimationFrame(frameId);
  frameId = null;
  renderer = null;
  if (glRenderer && glRenderer.dispose) glRenderer.dispose();
  glRenderer = null; glCanvas = null;
  offRenderer = null; offCanvas = null;
  document.getElementById('anim_rows').innerHTML = '';
  document.getElementById('fps').textContent = '';
  var canvas = document.getElementById('cv'), ctx = canvas.getContext('2d');
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,canvas.width,canvas.height);
}
function skeletonText(ab, name, allowMissingEvents){
  var bytes = new Uint8Array(ab), obj;
  if (!bytes.length) throw new Error('骨架文件为空：' + name);
  if (bytes[0] === 0x1c) {
    obj = CGSSSkelParser.parse(ab);
  } else {
    var text;
    try { text = new TextDecoder('utf-8', { fatal: true }).decode(ab); }
    catch(e){ throw new Error('无法识别骨架文件：' + name); }
    try { obj = JSON.parse(text); }
    catch(e){ throw new Error('文件 "' + name + '" 不是骨架 JSON 或 CGSS 二进制骨架。'); }
  }
  if (!obj || !Array.isArray(obj.bones) || !obj.bones.length)
    throw new Error('文件 "' + name + '" 缺少骨架数据。');
  // Preview rendering does not consume game-side events. Keep the visual timelines usable.
  if (allowMissingEvents) Object.values(obj.animations || {}).forEach(function(animation){
    if (!Array.isArray(animation.events)) return;
    animation.events = animation.events.filter(function(event){
      return event && event.name && Object.prototype.hasOwnProperty.call(obj.events || {}, event.name);
    });
    if (!animation.events.length) delete animation.events;
  });
  return JSON.stringify(obj);
}
function validatedAtlasText(ab, name){
  var bytes = new Uint8Array(ab);
  if (bytes.length && bytes[0] === 0x1c)
    throw new Error('图集栏选中了二进制骨架 "' + name + '"。骨架应放在骨架栏；图集请选择 SPC{卡id}.atlas(.asset) 或 SP3S{卡id}_tex.atlas(.asset)。');
  var text;
  try { text = new TextDecoder('utf-8', { fatal: true }).decode(ab); }
  catch(e){ throw new Error('文件 "' + name + '" 不是文本图集。'); }
  if (/[\x00-\x08\x0b\x0c\x0e-\x1f]/.test(text) || /^\s*[\[{]/.test(text))
    throw new Error('文件 "' + name + '" 不是 Spine 图集，请选择 .atlas 或 .atlas.asset。');
  try {
    var atlas = new spine.TextureAtlas(text, function(){ return new spine.FakeTexture({ width: 1, height: 1 }); });
    if (!atlas.pages.length || !atlas.regions.length) throw new Error('empty atlas');
  } catch(e){ throw new Error('图集 "' + name + '" 格式无效或内容不完整。'); }
  return text;
}

function readSkeleton(file, allowMissingEvents){
  return file.arrayBuffer().then(function(ab){
    return { name: file.name, text: skeletonText(ab, file.name, allowMissingEvents) };
  });
}

function readPng(file){
  return new Promise(function(resolve, reject){
    var img = new Image(), url = URL.createObjectURL(file);
    img.onload = function(){ URL.revokeObjectURL(url); resolve({ name: file.name, image: img }); };
    img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error('贴图无法读取：' + file.name)); };
    img.src = url;
  });
}

function supersedeCatalogLoad(){
  if (!catalogLoad) return;
  catalogLoad.abort();
  catalogLoad = null;
  Object.keys(loading).forEach(function(key){ loading[key] = false; });
}

function assetFile(asset, signal){
  return fetch(asset.url, { signal: signal }).then(function(response){
    if (!response.ok) throw new Error('无法读取 ' + asset.name + '（HTTP ' + response.status + '）');
    return response.blob();
  }).then(function(blob){ return new File([blob], asset.name, { type: blob.type }); });
}

async function loadCatalogEntry(entry){
  supersedeCatalogLoad();
  var request = new AbortController();
  catalogLoad = request;
  resetPreview();
  skelList = [];
  setRigVariants([], 0);
  atlasText = null;
  pngMap = {};
  compositeMap = {};
  Object.keys(loadVersion).forEach(function(key){
    ++loadVersion[key];
    loadErrors[key] = '';
    loading[key] = true;
  });
  ['f_skel', 'f_atlas', 'f_png'].forEach(function(id){ document.getElementById(id).value = ''; });
  document.getElementById('chk_flip').checked = entry.kind === 'petit';
  document.getElementById('chk_all').checked = true;
  playing = true;
  msg('正在加载 ' + entry.title + '…');
  var get = function(asset){ return assetFile(asset, request.signal); };
  var skeletonsByUrl = new Map();
  function getSkeleton(asset){
    if (!skeletonsByUrl.has(asset.url))
      skeletonsByUrl.set(asset.url, get(asset).then(function(file){ return readSkeleton(file, true); }));
    return skeletonsByUrl.get(asset.url);
  }
  try {
    var result = await Promise.all([
      Promise.all(entry.skeletons.map(getSkeleton)),
      entry.atlas ? get(entry.atlas).then(function(file){
        return file.arrayBuffer().then(function(ab){ return validatedAtlasText(ab, file.name); });
      }) : null,
      Promise.all(entry.pngs.map(function(asset){ return get(asset).then(readPng); })),
      Promise.all((entry.variants || []).map(async function(variant){
        var loaded = await getSkeleton(variant.skeleton);
        return { label: variant.label, url: variant.skeleton.url, skeleton: loaded };
      }))
    ]);
    if (catalogLoad !== request) return;
    skelList = result[0];
    atlasText = result[1];
    result[2].forEach(function(entry){ pngMap[entry.name] = entry.image; });
    buildComposite();
    var index = result[3].findIndex(function(variant){ return variant.url === entry.skeletons[0].url; });
    setRigVariants(result[3], Math.max(0, index));
    Object.keys(loading).forEach(function(key){ loading[key] = false; });
    if (atlasText && rigVariants.length){
      refreshRigCompatibility();
    } else finishSkelLoad(skelList.length);
    if (!atlasText && !document.getElementById('skin_swap').hidden){
      document.getElementById('skin_swap').open = true;
      msg('动作骨架已加载。请选择一组角色图集和贴图。');
    }
  } catch (err) {
    if (catalogLoad !== request) return;
    request.abort();
    Object.keys(loading).forEach(function(key){ loading[key] = false; });
    msg('加载失败：' + err.message);
  } finally {
    if (catalogLoad === request) catalogLoad = null;
  }
}

// 小人的 flip 骨骼控制左右镜像，同时保留骨架定义的缩放。
function applyPetitFlip(s){
  if (s.flipBone === undefined) s.flipBone = s.skeleton.findBone('flip') || null;
  if (s.flipBone){
    var direction = document.getElementById('chk_flip').checked ? -1 : 1;
    s.flipBone.scaleX = direction * Math.abs(s.flipBone.data.scaleX);
  }
}

document.getElementById('f_skel').addEventListener('change', function(e){
  supersedeCatalogLoad();
  resetPreview();
  skelList = [];
  setRigVariants([], 0);
  loadErrors.skel = '';
  var files = Array.prototype.slice.call(e.target.files);
  var version = ++loadVersion.skel;
  loading.skel = files.length > 0;
  if (!files.length) { fileStatus('未选择骨架'); return; }
  Promise.all(files.map(function(file){ return readSkeleton(file); })).then(function(list){
    if (version !== loadVersion.skel) return;
    loading.skel = false;
    skelList = list;
    var rigs = list.map(function(skeleton){ return { match: manualRigFamily(skeleton.name), skeleton: skeleton }; });
    if (rigs.length === 2 && rigs.every(function(rig){ return rig.match; }) &&
        rigs[0].match.family === rigs[1].match.family && rigs[0].match.label !== rigs[1].match.label){
      skelList = [list[0]];
      setRigVariants(rigs.map(function(rig){ return { label: rig.match.label, skeleton: rig.skeleton }; }), 0);
      refreshRigCompatibility();
      return;
    }
    setRigVariants([], 0);
    finishSkelLoad(list.length);
  }).catch(function(err){
    if (version !== loadVersion.skel) return;
    loading.skel = false;
    loadErrors.skel = '读取骨架失败：' + err.message;
    fileStatus('');
  });
});
function finishSkelLoad(n){
  // 按图层优先级排序：bg -> eff2 -> chara -> eff1 -> fg（其他排最后，按名字）
  function priority(name){
    var s = name.toLowerCase();
    if (s.indexOf('bg') >= 0) return 0;
    if (s.indexOf('eff2') >= 0) return 1;
    if (s.indexOf('chara') >= 0) return 2;
    if (s.indexOf('eff1') >= 0) return 3;
    if (s.indexOf('fg') >= 0) return 4;
    return 5;
  }
  skelList.sort(function(a, b){
    var pa = priority(a.name), pb = priority(b.name);
    return pa !== pb ? pa - pb : (a.name < b.name ? -1 : 1);
  });
  var hint = '';
  try {
    var sk = skelList.length ? JSON.parse(skelList[0].text) : null;
    if (sk && sk.bones){
      var shadow = null;
      for (var i = 0; i < sk.bones.length; i++)
        if (sk.bones[i].name === 'shadow'){ shadow = sk.bones[i]; break; }
      var isN = shadow && typeof shadow.scaleX === 'number' && Math.abs(shadow.scaleX) < 1;
      hint = isN ? '（检测到 N 骨架：老卡用）' : '（检测到 s 骨架：新卡用）';
    }
  } catch(e){}
  fileStatus('已选骨架 ' + n + ' 个（已按图层排序）' + hint);
  refreshRigCompatibility();
}
document.getElementById('f_atlas').addEventListener('change', function(e){
  supersedeCatalogLoad();
  resetPreview();
  atlasText = null;
  loadErrors.atlas = '';
  var version = ++loadVersion.atlas;
  var f = e.target.files[0];
  loading.atlas = !!f;
  if (!f) { fileStatus('未选择图集'); return; }
  f.arrayBuffer().then(function(ab){
    if (version !== loadVersion.atlas) return;
    atlasText = validatedAtlasText(ab, f.name);
    loading.atlas = false;
    fileStatus('已选图集：' + f.name);
    refreshRigCompatibility();
  }).catch(function(err){
    if (version !== loadVersion.atlas) return;
    loading.atlas = false;
    loadErrors.atlas = err.message;
    fileStatus('');
  });
});
document.getElementById('f_png').addEventListener('change', function(e){
  supersedeCatalogLoad();
  resetPreview();
  pngMap = {};
  compositeMap = {};
  loadErrors.png = '';
  var version = ++loadVersion.png;
  var files = Array.prototype.slice.call(e.target.files);
  loading.png = files.length > 0;
  if (!files.length) { fileStatus('未选择贴图'); return; }
  Promise.all(files.map(readPng)).then(function(images){
    if (version !== loadVersion.png) return;
    loading.png = false;
    images.forEach(function(entry){ pngMap[entry.name] = entry.image; });
    buildComposite();
    fileStatus('已选贴图 ' + files.length + ' 个');
    refreshRigCompatibility();
  }).catch(function(err){
    if (version !== loadVersion.png) return;
    loading.png = false;
    loadErrors.png = err.message;
    fileStatus('');
  });
});

// CGSS 是 RGB 主贴图 + 独立 A8 透明通道，两张合成为真正的 RGBA，去掉黑底黑边
function buildComposite(images = pngMap){
  var result = Object.create(null);
  Object.keys(images).forEach(function(k){
    var m = /^(.*)_A8\.png$/i.exec(k);
    if (!m) return;
    var rgbName = m[1] + '.png';
    if (!images[rgbName]) return;
    var rgb = images[rgbName], a8 = images[k];
    var c = document.createElement('canvas');
    c.width = rgb.naturalWidth;
    c.height = rgb.naturalHeight;
    var cx = c.getContext('2d');
    cx.drawImage(rgb, 0, 0, c.width, c.height);
    cx.globalCompositeOperation = 'destination-in';  // 用 A8 的 alpha 保留 RGB
    cx.drawImage(a8, 0, 0, c.width, c.height);
    result[rgbName] = c;
  });
  if (images === pngMap) compositeMap = result;
  return result;
}

function normalizeCarnivalAttachments(skeleton, atlas, name){
  var animations = skeleton.animations;
  var skin = skeleton.skins && skeleton.skins.default;
  var carnival = animations && animations.action_10_3 && animations.action_10_4 && animations.idle_3 && animations.idle_4;
  var sweets = /^(SPKCStaff|SPACSkelton)/i.test(name || '');
  if ((!carnival && !sweets) || !skin || !skin.shadow || !skin.shadow.shadow) return;

  // The unpadded shadow distinguishes 1× card atlases from 2× Carnival atlases.
  var shadow = atlas.findRegion('shadow');
  if (!shadow) return;
  var pixelScale = Math.round(shadow.originalWidth / skin.shadow.shadow.width);
  if ((pixelScale !== 1 && pixelScale !== 2) ||
      Math.abs(shadow.originalWidth - skin.shadow.shadow.width * pixelScale) > 1 ||
      Math.abs(shadow.originalHeight - skin.shadow.shadow.height * pixelScale) > 1) return;

  Object.values(skin).forEach(function(slot){
    Object.keys(slot).forEach(function(name){
      var attachment = slot[name];
      if ((attachment.type && attachment.type !== 'region') ||
          !(attachment.width > 0 && attachment.height > 0)) return;
      var region = atlas.findRegion(attachment.path || attachment.name || name);
      if (!region || region.width <= 1 || region.height <= 1) return;

      // Newer skins add symmetric padding in 100-unit steps to their logical canvas.
      var paddingStep = 100 * pixelScale;
      var extraWidth = region.originalWidth - attachment.width * pixelScale;
      var extraHeight = region.originalHeight - attachment.height * pixelScale;
      var padding = Math.round(extraWidth / (2 * paddingStep)) * paddingStep;
      if (!padding || (padding < 0 && !sweets) || Math.abs(extraWidth - 2 * padding) > 1 ||
          Math.abs(extraHeight - 2 * padding) > 1 ||
          region.offsetX < padding || region.offsetY < padding ||
          region.offsetX + region.width > region.originalWidth - padding ||
          region.offsetY + region.height > region.originalHeight - padding) return;

      // Spine uses width / originalWidth for the packed rectangle and anchors it about
      // the canvas center. Matching the padded dimensions restores the correct ratio.
      attachment.width = region.originalWidth / pixelScale;
      attachment.height = region.originalHeight / pixelScale;
    });
  });
}

function makeAtlas(text, images, composites){
  return new spine.TextureAtlas(text, function(path){
    var key = path.split(/[\\\/]/).pop();
    var image = composites[key] || images[key];
    if (!image) throw new Error('图集引用的贴图「' + key + '」不在已选贴图里，请选择配套的 PNG。');
    return new spine.canvas.CanvasTexture(image);
  });
}

function rigData(source, atlas){
  var skeleton = JSON.parse(source.text);
  normalizeCarnivalAttachments(skeleton, atlas, source.name);
  return new spine.SkeletonJson(new spine.AtlasAttachmentLoader(atlas)).readSkeletonData(skeleton);
}

function inspectRigs(atlas){
  var choices = rigVariants.length ? rigVariants : [{ label: '当前骨架', skeleton: skelList[0] }];
  return choices.map(function(choice){
    try { return { label: choice.label, data: rigData(choice.skeleton, atlas) }; }
    catch (err) { return { label: choice.label, error: err.message }; }
  });
}

function showRigResults(results, using){
  var selector = document.getElementById('rig_variant');
  results.forEach(function(result, index){
    if (selector.options[index]) selector.options[index].disabled = !!using && !result.data;
  });
  var summary = results.map(function(result){
    return result.label + (result.data ? ' 可用' : ' 无法加载（' + result.error + '）');
  }).join('\n');
  document.getElementById('skin_status').textContent = summary +
    (using && results.length > 1 ? '\n当前使用 ' + using : '');
}

function selectRig(index, data){
  var previous = skelList[0] && skelList[0].sel ? skelList[0].sel.value : '';
  if (rigVariants.length){
    rigIndex = index;
    document.getElementById('rig_variant').selectedIndex = index;
    skelList = [{ ...rigVariants[index].skeleton }];
  }
  resetPreview();
  tryInit(previous, [data]);
}

function refreshRigCompatibility(){
  if (!rigVariants.length || !atlasText || !Object.keys(pngMap).length ||
      Object.values(loading).some(Boolean) || Object.values(loadErrors).some(Boolean)){
    tryInit();
    return;
  }
  try {
    var results = inspectRigs(makeAtlas(atlasText, pngMap, compositeMap));
    var index = results[rigIndex].data ? rigIndex : results.findIndex(function(result){ return result.data; });
    if (index >= 0) selectRig(index, results[index].data);
    showRigResults(results, index >= 0 ? results[index].label : '');
    if (index < 0){
      document.getElementById('skin_swap').open = true;
      msg('这组图集无法加载。请更换图集及对应贴图。');
    }
  } catch (err) { msg('加载失败：' + err.message); }
}

document.getElementById('skin_apply').addEventListener('click', async function(){
  var atlasFile = document.getElementById('skin_atlas').files[0];
  var textures = Array.from(document.getElementById('skin_png').files);
  var status = document.getElementById('skin_status');
  if (skelList.length !== 1 || !atlasFile || !textures.length){
    status.textContent = '请先选动作，再选择配套的图集和 PNG 贴图。';
    return;
  }
  var button = this;
  var version = ++skinVersion;
  button.disabled = true;
  status.textContent = '正在检查图集和骨架…';
  try {
    var files = await Promise.all([atlasFile.arrayBuffer(), Promise.all(textures.map(readPng))]);
    if (version !== skinVersion) return;
    var text = validatedAtlasText(files[0], atlasFile.name);
    var images = Object.create(null);
    files[1].forEach(function(file){ images[file.name] = file.image; });
    var composites = buildComposite(images);
    var results = inspectRigs(makeAtlas(text, images, composites));
    var index = results[rigIndex].data ? rigIndex : results.findIndex(function(result){ return result.data; });
    if (index < 0){
      status.textContent = results.map(function(result){ return result.label + ' 无法加载（' + result.error + '）'; }).join('\n');
      return;
    }
    atlasText = text;
    pngMap = images;
    compositeMap = composites;
    loadErrors.atlas = loadErrors.png = '';
    selectRig(index, results[index].data);
    showRigResults(results, results[index].label);
  } catch (err) {
    if (version === skinVersion) status.textContent = '更换角色失败：' + err.message;
  } finally {
    if (version === skinVersion) button.disabled = false;
  }
});

document.getElementById('rig_variant').addEventListener('change', function(){
  var index = this.selectedIndex;
  if (!rigVariants[index]) return;
  if (!atlasText){
    rigIndex = index;
    skelList = [{ ...rigVariants[index].skeleton }];
    return;
  }
  try {
    var results = inspectRigs(makeAtlas(atlasText, pngMap, compositeMap));
    if (results[index].data) selectRig(index, results[index].data);
    else this.selectedIndex = rigIndex;
    showRigResults(results, results[rigIndex].label);
  } catch (err) {
    this.selectedIndex = rigIndex;
    document.getElementById('skin_status').textContent = err.message;
  }
});

function tryInit(preferredAnimation, preparedData){
  if (loading.skel || loading.atlas || loading.png || loadErrors.skel || loadErrors.atlas || loadErrors.png) return;
  if (!skelList.length || !atlasText || !Object.keys(pngMap).length) return;
  try {
    var canvas = document.getElementById('cv');
    var ctx = canvas.getContext('2d');
    renderer = new spine.canvas.SkeletonRenderer(ctx);
    renderer.triangleRendering = true; // mesh 附件必须开三角形渲染
    var atlas = preparedData ? null : makeAtlas(atlasText, pngMap, compositeMap);

    canvas.width = 1400;
    canvas.height = 1400;
    ctx.setTransform(1,0,0,1,0,0);
    ctx.clearRect(0,0,canvas.width,canvas.height);
    offCanvas = document.createElement('canvas');
    offCanvas.width = canvas.width * SS;
    offCanvas.height = canvas.height * SS;
    offRenderer = new spine.canvas.SkeletonRenderer(offCanvas.getContext('2d'));
    offRenderer.triangleRendering = true;
    // 优先 WebGL（无三角形接缝）；失败则回退 canvas 2D + 超采样
    glCanvas = null; glRenderer = null;
    try {
      glCanvas = document.createElement('canvas');
      glCanvas.width = canvas.width;
      glCanvas.height = canvas.height;
      glRenderer = new CGSSWebGLRenderer(glCanvas, { preserveDrawingBuffer: true });
    } catch (e2) { glRenderer = null; glCanvas = null; }

    skelList.forEach(function(s, index){
      var data = preparedData ? preparedData[index] : rigData(s, atlas);
      s.skeleton = new spine.Skeleton(data);
      s.skeleton.flipY = true;   // Spine 坐标 y 向上，canvas 是 y 向下，官方示例即此修法
      s.state = new spine.AnimationState(new spine.AnimationStateData(data));
      s.data = data;
    });

    var rows = document.getElementById('anim_rows');
    rows.innerHTML = '';
    skelList.forEach(function(s){
      var lab = document.createElement('label');
      lab.textContent = s.name + '：';
      var sel = document.createElement('select');
      s.data.animations.forEach(function(a){
        var o = document.createElement('option');
        o.textContent = a.name; o.value = a.name; sel.appendChild(o);
      });
      s.sel = sel;
      if (preferredAnimation && s.data.animations.some(function(animation){ return animation.name === preferredAnimation; }))
        sel.value = preferredAnimation;
      else if (canSwapSkin(s.name)){
        var playable = s.data.animations.find(function(animation){ return animation.duration > 0 && animation.name[0] !== '_'; });
        if (playable) sel.value = playable.name;
      }
      sel.addEventListener('change', function(){
        if (s.state && sel.value) s.state.setAnimation(0, sel.value, true);
      });
      var chk = document.createElement('input');
      chk.type = 'checkbox'; chk.checked = true;
      s.check = chk;
      rows.appendChild(lab); rows.appendChild(sel); rows.appendChild(chk);
      rows.appendChild(document.createElement('br'));
      if (sel.value) s.state.setAnimation(0, sel.value, true);
    });

    // 有背景(卡面动画)：用各层静态 setup 包围盒适配，背景铺满画面（特效动画范围大，不能按它缩放）
    // 没有背景(小人)：用动画全程包围盒适配，走路不会甩出画面
    var hasBg = false;
    skelList.forEach(function(s){ if (/bg/i.test(s.name)) hasBg = true; });
    var offset = new spine.Vector2(), size = new spine.Vector2(), temp = [];
    var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    skelList.forEach(function(s){
      var anim = findAnim(s);
      if (hasBg){
        s.skeleton.setToSetupPose();
        s.skeleton.updateWorldTransform();
        s.skeleton.getBounds(offset, size, temp);
        if (isFinite(offset.x) && size.x > 0) {
          minX = Math.min(minX, offset.x); minY = Math.min(minY, offset.y);
          maxX = Math.max(maxX, offset.x + size.x); maxY = Math.max(maxY, offset.y + size.y);
        }
      } else {
        var dur = anim ? anim.duration : 1;
        var steps = Math.max(2, Math.round(dur * 30));
        for (var k = 0; k <= steps; k++){
          var t = dur * k / steps;
          if (anim){ s.state.setAnimation(0, anim.name, false); s.state.update(t); }
          s.state.apply(s.skeleton);
          s.skeleton.updateWorldTransform();
          s.skeleton.getBounds(offset, size, temp);
          if (isFinite(offset.x) && size.x > 0) {
            minX = Math.min(minX, offset.x); minY = Math.min(minY, offset.y);
            maxX = Math.max(maxX, offset.x + size.x); maxY = Math.max(maxY, offset.y + size.y);
          }
        }
        if (anim) s.state.setAnimation(0, anim.name, true);
      }
    });
    if (isFinite(minX) && maxX > minX) {
      var bw = maxX - minX, bh = maxY - minY;
      fit.scale = Math.min(canvas.width / bw, canvas.height / bh) * 0.92;
      fit.tx = (canvas.width - (maxX + minX) * fit.scale) / 2;
      fit.ty = (canvas.height - (maxY + minY) * fit.scale) / 2;
    } else {
      fit.scale = 1; fit.tx = canvas.width / 2; fit.ty = canvas.height / 2;
    }
    msg('加载成功：' + skelList.length + ' 个骨架（自动适配画面）');
    previewReady = true;
    last = performance.now();
    loop(last, true);
  } catch (err) {
    resetPreview();
    msg('加载失败：' + err.message + '\n' + (err.stack || ''));
  }
}

function loop(t, drawStill){
  frameId = requestAnimationFrame(loop);
  if (!previewReady || (!playing && !drawStill)) return;
  var dt = Math.min(0.05, (t - last) / 1000);
  last = t;
  var sp = parseFloat(document.getElementById('speed').value) || 1;
  var canvas = document.getElementById('cv');
  var ctx = canvas.getContext('2d');
  if (glRenderer) {
    glRenderer.setTransform(fit.scale, fit.tx, fit.ty);
    glRenderer.clear(0.2, 0.2, 0.2, 1);
    skelList.forEach(function(s){
      if (s.check && !s.check.checked) return;
      s.state.update(dt * sp);
      s.state.apply(s.skeleton);
      applyPetitFlip(s);
      s.skeleton.updateWorldTransform();
      glRenderer.draw(s.skeleton);
    });
    ctx.setTransform(1,0,0,1,0,0);
    ctx.drawImage(glCanvas, 0, 0, glCanvas.width, glCanvas.height, 0, 0, canvas.width, canvas.height);
    document.getElementById('fps').textContent = ' ' + Math.round(1000 / Math.max(1, dt * 1000 / sp)) + ' fps (WebGL)';
    return;
  }
  var octx = offCanvas ? offCanvas.getContext('2d') : null;
  var renderCtx = octx || ctx;
  var r = octx ? offRenderer : renderer;
  renderCtx.setTransform(1,0,0,1,0,0);
  renderCtx.clearRect(0,0,offCanvas ? offCanvas.width : canvas.width, offCanvas ? offCanvas.height : canvas.height);
  renderCtx.setTransform(fit.scale * (octx ? SS : 1),0,0,fit.scale * (octx ? SS : 1),fit.tx * (octx ? SS : 1),fit.ty * (octx ? SS : 1));
  skelList.forEach(function(s){
    if (s.check && !s.check.checked) return;
    s.state.update(dt * sp);
    s.state.apply(s.skeleton);
    applyPetitFlip(s);
    s.skeleton.updateWorldTransform();
    r.draw(s.skeleton);
  });
  if (octx) {
    ctx.setTransform(1,0,0,1,0,0);
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(offCanvas, 0, 0, offCanvas.width, offCanvas.height, 0, 0, canvas.width, canvas.height);
  }
  document.getElementById('fps').textContent = ' ' + Math.round(1000 / Math.max(1, dt * 1000 / sp)) + ' fps';
}

document.getElementById('btn_play').onclick = function(){ playing = true; };
document.getElementById('btn_pause').onclick = function(){ playing = false; };
document.getElementById('chk_all').addEventListener('change', function(e){
  skelList.forEach(function(s){ if (s.check) s.check.checked = e.target.checked; });
});

/* ================= MP4 导出（WebCodecs H.264 + mp4-muxer） =================
 * 画布范围以 bg（背景）骨架为界；没有 bg 时用全部图层包围盒。
 * 最高规格：30fps（数据原生帧率）+ 高码率 H.264，尺寸取背景实际大小（偶数，上限 4096）。
 */
function findAnim(s){
  var name = s.sel && s.sel.value ? s.sel.value : (s.data.animations[0] ? s.data.animations[0].name : null);
  if (!name) return null;
  for (var i = 0; i < s.data.animations.length; i++)
    if (s.data.animations[i].name === name) return s.data.animations[i];
  return null;
}

function exportBounds(){
  var fps = 30, dur = 0;
  skelList.forEach(function(s){
    var a = findAnim(s);
    if (a && a.duration > dur) dur = a.duration;
  });
  if (!(dur > 0)) dur = 8;
  var bg = null;
  skelList.forEach(function(s){ if (/bg/i.test(s.name)) bg = s; });
  var targets = bg ? [bg] : skelList;
  // 画面范围 = 背景的静态大小（setup pose 包围盒）；没有背景（小人）就用角色自身大小
  var offset = new spine.Vector2(), size = new spine.Vector2(), temp = [];
  var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  targets.forEach(function(s){
    s.skeleton.setToSetupPose();
    s.skeleton.updateWorldTransform();
    s.skeleton.getBounds(offset, size, temp);
    if (isFinite(offset.x) && size.x > 0){
      minX = Math.min(minX, offset.x); minY = Math.min(minY, offset.y);
      maxX = Math.max(maxX, offset.x + size.x); maxY = Math.max(maxY, offset.y + size.y);
    }
  });
  if (!isFinite(minX) || !(maxX > minX)){ minX = -600; minY = -600; maxX = 600; maxY = 600; }
  return { minX: minX, minY: minY, maxX: maxX, maxY: maxY, duration: dur, fps: fps };
}

function exportMp4Name(){
  for (var i = 0; i < skelList.length; i++){
    if (/bg/i.test(skelList[i].name)){
      var m = /SP3S(\d+)/.exec(skelList[i].name);
      if (m) return 'SP3S' + m[1];
    }
  }
  var m2 = /(SPC\d+|SP3S\d+)/.exec(skelList.length ? skelList[0].name : '');
  return m2 ? m2[1] : 'export';
}

async function exportMP4(){
  if (!previewReady){ msg('请先成功加载骨架、图集和贴图'); return; }
  if (!window.VideoEncoder || !window.VideoFrame){ msg('当前浏览器不支持 WebCodecs，无法导出 MP4（请用新版 Chrome/Edge）'); return; }
  if (typeof Mp4Muxer === 'undefined'){ msg('缺少 mp4-muxer.min.js'); return; }
  var btn = document.getElementById('btn_export');
  if (btn.disabled) return;
  var b = exportBounds();
  var sourceSkeletons = skelList, sourceName = exportMp4Name();
  // H.264(yuv420) 要求宽高为偶数：先按背景尺寸四舍五入，再向上取偶（尽量贴近背景实际大小）
  var w = Math.round(b.maxX - b.minX), h = Math.round(b.maxY - b.minY);
  var maxDim = 4096;
  var sc = Math.min(1, maxDim / Math.max(w, h));
  w = Math.max(2, Math.floor(w * sc)); h = Math.max(2, Math.floor(h * sc));
  if (w % 2) w++; if (h % 2) h++;
  var st = document.getElementById('export_status');
  btn.disabled = true;
  st.textContent = '准备中（' + w + 'x' + h + '，' + b.duration.toFixed(1) + 's @ ' + b.fps + 'fps）...';

  var canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  var ctx = canvas.getContext('2d');
  // 优先 WebGL 导出（无接缝）；失败回退 canvas 2D 超采样
  var expGL = null, expGLCanvas = null;
  try {
    expGLCanvas = document.createElement('canvas');
    expGLCanvas.width = w; expGLCanvas.height = h;
    expGL = new CGSSWebGLRenderer(expGLCanvas, { preserveDrawingBuffer: true });
  } catch (e3) { expGL = null; expGLCanvas = null; }
  var EF = Math.min(2, maxDim / Math.max(w, h));   // 导出也做超采样（离屏不超过 4096）
  var expOff = document.createElement('canvas');
  expOff.width = Math.max(2, Math.round(w * EF));
  expOff.height = Math.max(2, Math.round(h * EF));
  var ectx = expOff.getContext('2d');
  var expRenderer = new spine.canvas.SkeletonRenderer(ectx);
  expRenderer.triangleRendering = true;

  var muxer = new Mp4Muxer.Muxer({
    target: new Mp4Muxer.ArrayBufferTarget(),
    video: { codec: 'avc', width: w, height: h, frameRate: b.fps },
    fastStart: 'in-memory'
  });
  var bitrate = Math.min(100000000, Math.round(w * h * b.fps * 0.7));
  var encoder, encodeError, muxedFrames = 0, hasDecoderConfig = false;

  var s = Math.min(w / (b.maxX - b.minX), h / (b.maxY - b.minY));
  var tx = -b.minX * s + (w - (b.maxX - b.minX) * s) / 2;
  var ty = -b.minY * s + (h - (b.maxY - b.minY) * s) / 2;

  function drawFrame(t){
    if (expGL) {
      expGL.setTransform(s, tx, ty);
      expGL.clear(0.2, 0.2, 0.2, 1);
      sourceSkeletons.forEach(function(sk){
        if (sk.check && !sk.check.checked) return;
        var an = findAnim(sk);
        if (!an) return;
        sk.state.setAnimation(0, an.name, false);
        sk.state.update(t);
        sk.state.apply(sk.skeleton);
        applyPetitFlip(sk);
        sk.skeleton.updateWorldTransform();
        expGL.draw(sk.skeleton);
      });
      ctx.setTransform(1,0,0,1,0,0);
      ctx.drawImage(expGLCanvas, 0, 0, w, h);
      return;
    }
    ectx.setTransform(1,0,0,1,0,0);
    ectx.fillStyle = '#333';
    ectx.fillRect(0,0,expOff.width,expOff.height);
    ectx.setTransform(s*EF,0,0,s*EF,tx*EF,ty*EF);
    sourceSkeletons.forEach(function(sk){
      if (sk.check && !sk.check.checked) return;
      var an = findAnim(sk);
      if (!an) return;
      sk.state.setAnimation(0, an.name, false);
      sk.state.update(t);
      sk.state.apply(sk.skeleton);
      applyPetitFlip(sk);
      sk.skeleton.updateWorldTransform();
      expRenderer.draw(sk.skeleton);
    });
    ctx.setTransform(1,0,0,1,0,0);
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(expOff, 0, 0, expOff.width, expOff.height, 0, 0, w, h);
  }

  var total = Math.ceil(b.duration * b.fps);
  const timestamp = i => Math.round(i * 1e6 / b.fps);
  const yieldToPage = () => new Promise(resolve => setTimeout(resolve, 0));

  try {
    var config;
    for (const codec of ['avc1.4d002a', 'avc1.42001f']) {
      const candidate = { codec, width: w, height: h, bitrate, framerate: b.fps, avc: { format: 'avc' } };
      const support = await VideoEncoder.isConfigSupported(candidate);
      if (support.supported) { config = candidate; break; }
    }
    if (!config) throw new Error('浏览器不支持当前尺寸的 H.264 编码');
    encoder = new VideoEncoder({
      output(chunk, meta){
        if (encodeError) return;
        try {
          if (chunk.duration > 0) muxer.addVideoChunk(chunk, meta);
          else {
            // Some encoders omit duration even when the input frame provides it.
            const frame = Math.round(chunk.timestamp * b.fps / 1e6);
            const bytes = new Uint8Array(chunk.byteLength);
            chunk.copyTo(bytes);
            muxer.addVideoChunkRaw(bytes, chunk.type, chunk.timestamp, timestamp(frame + 1) - timestamp(frame), meta);
          }
          hasDecoderConfig ||= !!meta?.decoderConfig?.description?.byteLength;
          muxedFrames++;
        } catch (error) { encodeError = error; }
      },
      error(error){ encodeError = error; }
    });
    encoder.configure(config);

    for (let i = 0; i < total; i++){
      while (!encodeError && encoder.encodeQueueSize >= 8) await yieldToPage();
      if (encodeError) throw encodeError;
      drawFrame(i / b.fps);
      const time = timestamp(i);
      const frame = new VideoFrame(canvas, { timestamp: time, duration: timestamp(i + 1) - time });
      try { encoder.encode(frame, { keyFrame: i % (b.fps * 2) === 0 }); }
      finally { frame.close(); }
      if ((i + 1) % 12 === 0 || i + 1 === total){
        st.textContent = '编码中 ' + (i + 1) + '/' + total + ' 帧';
        await yieldToPage();
      }
    }
    await encoder.flush();
    if (encodeError) throw encodeError;
    if (muxedFrames !== total) throw new Error('视频帧不完整（' + muxedFrames + '/' + total + '）');
    if (!hasDecoderConfig) throw new Error('编码器没有提供 H.264 解码配置');
    muxer.finalize();
    var blob = new Blob([muxer.target.buffer], { type: 'video/mp4' });
    var name = 'CGSS_' + sourceName + '_' + w + 'x' + h + '_' + b.fps + 'fps.mp4';
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    st.textContent = '已导出 ' + name;
    if (sourceSkeletons === skelList)
      msg('导出完成：' + name + '（' + w + 'x' + h + '，' + b.fps + 'fps，最高码率）');
  } catch(e){
    console.error(e);
    st.textContent = '导出失败：' + e.message;
  } finally {
    if (encoder && encoder.state !== 'closed') encoder.close();
    if (expGL) expGL.gl.getExtension('WEBGL_lose_context')?.loseContext();
    btn.disabled = false;
  }
}

document.getElementById('btn_export').onclick = exportMP4;
</script>
